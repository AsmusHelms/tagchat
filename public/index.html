<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TAGCHAT</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section id="entry" class="entry-screen">
      <form id="joinForm" class="join-card" autocomplete="off">
        <label for="aliasInput">SKRIV DIT ALIAS</label>
        <input id="aliasInput" maxlength="16" autofocus />
        <button type="submit">GÅ IND</button>
        <p id="joinError" class="error" aria-live="polite"></p>
      </form>
    </section>

    <section id="roomScreen" class="room-screen hidden">
      <div class="toolbar">
        <button id="chatToggle" type="button">CHAT</button>
        <span id="presence">0 / 10</span>
      </div>

      <div class="world-wrap">
        <div id="world" class="world" aria-label="Det fælles rum"></div>
      </div>

      <form id="messageForm" class="message-form" autocomplete="off">
        <input id="messageInput" maxlength="140" placeholder="Skriv noget..." />
        <button type="submit">SEND</button>
        <div id="counter" class="counter">0 / 140</div>
      </form>

      <aside id="chatPanel" class="chat-panel" aria-hidden="true">
        <div class="chat-header">
          <strong>CHAT</strong>
          <button id="chatClose" type="button" aria-label="Luk chat">×</button>
        </div>
        <div id="chatLog" class="chat-log"></div>
      </aside>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
